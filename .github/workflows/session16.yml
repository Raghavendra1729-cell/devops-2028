name: Session 16 Session-16-CI-CD-GitHub-Actions
'on':
  push:
    branches:
    - master
    paths:
    - Session-16-CI-CD-GitHub-Actions/**
    - Session-16-CI-CD-GitHub-Actions/Dockerfile
    - Final-DevOps-Project/helm/**
    - Final-DevOps-Project/kubernetes/create-secret.sh
    - .github/workflows/session16.yml
  pull_request:
    paths:
    - Session-16-CI-CD-GitHub-Actions/**
    - Session-16-CI-CD-GitHub-Actions/Dockerfile
    - .github/workflows/session16.yml
  workflow_dispatch:
    inputs:
      gate_demo:
        description: Run a controlled failure to check the gate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: pip install -r Session-16-CI-CD-GitHub-Actions/requirements-dev.txt
    - name: Build application
      run: python -m compileall -q Session-16-CI-CD-GitHub-Actions/app.py
    - name: Unit tests
      run: pytest -v Session-16-CI-CD-GitHub-Actions/tests --junitxml=test-results.xml
    - name: Demonstrate a failing gate
      if: ${{ inputs.gate_demo == true }}
      run: 'python -c ''raise SystemExit("Controlled gate failure: publishing and deployment must be skipped")'''
    - name: Check sensitive files
      run: |-
        if find Session-16-CI-CD-GitHub-Actions -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
          echo "Sensitive file found"
          exit 1
        fi
    - name: Upload test and scan reports
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: session16-reports
        path: |-
          test-results.xml
          *.json
        if-no-files-found: ignore
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: docker/setup-qemu-action@v4.4.0
    - uses: docker/setup-buildx-action@v4.4.1
    - name: Build image for scanning
      run: docker build -t ghcr.io/raghavendra1729-cell/course-ci-demo:${{ github.sha }} -f Session-16-CI-CD-GitHub-Actions/Dockerfile Session-16-CI-CD-GitHub-Actions
    - name: Registry login
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image
      uses: docker/build-push-action@v7.4.0
      with:
        context: Session-16-CI-CD-GitHub-Actions
        file: Session-16-CI-CD-GitHub-Actions/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |-
          ghcr.io/raghavendra1729-cell/course-ci-demo:${{ github.sha }}
          ghcr.io/raghavendra1729-cell/course-ci-demo:latest
    - name: Upload application build
      uses: actions/upload-artifact@v7.0.1
      with:
        name: session16-application
        path: |-
          Session-16-CI-CD-GitHub-Actions/app.py
          Session-16-CI-CD-GitHub-Actions/requirements.txt
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Create temporary Kubernetes cluster
      run: |-
        curl -fsSL https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64 -o kind
        chmod +x kind
        sudo mv kind /usr/local/bin/kind
        kind create cluster --wait 120s
    - name: Registry pull secret
      env:
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        kubectl create namespace pipeline-demo
        kubectl -n pipeline-demo create secret docker-registry ghcr --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="$REGISTRY_TOKEN"
        kubectl -n pipeline-demo patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr"}]}'
    - name: Create application secret
      run: Final-DevOps-Project/kubernetes/create-secret.sh pipeline-demo
    - name: Deploy and verify
      run: |-
        helm upgrade --install notes Final-DevOps-Project/helm/notes -n pipeline-demo --set image.repository=ghcr.io/raghavendra1729-cell/course-ci-demo --set image.tag=${{ github.sha }} --set ingress.enabled=false --set autoscaling.enabled=false --wait --timeout 180s
        kubectl -n pipeline-demo get pods,services
        kubectl -n pipeline-demo port-forward service/notes 5000:5000 > port-forward.log 2>&1 &
        for _ in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:5000/ready; then break; fi
          sleep 1
        done
        curl -fsS http://127.0.0.1:5000/health
        curl -fsS -X POST http://127.0.0.1:5000/api/calculate -H 'Content-Type: application/json' -d '{"a":6,"b":3,"operation":"multiply"}' | tee deployment-result.json
        python -c 'import json; assert json.load(open("deployment-result.json"))["result"] == 18'
        kubectl -n pipeline-demo logs deployment/notes --tail=10
    - name: Save deployment result
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: session16-deployment
        path: |-
          deployment-result.json
          port-forward.log
    - name: Remove temporary cluster
      if: always()
      run: kind delete cluster
