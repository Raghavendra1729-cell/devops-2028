apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: curlimages/curl:8.12.1
          command: ["sh", "-c"]
          args: ["while true; do curl -fsS http://notes:5000/work >/dev/null; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
