apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi
  labels:
    lab: pod-lifecycle
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date > /data/time.txt; sleep 5; done"]
      volumeMounts:
        - name: shared
          mountPath: /data
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "while true; do cat /data/time.txt 2>/dev/null || true; sleep 5; done"]
      volumeMounts:
        - name: shared
          mountPath: /data
  volumes:
    - name: shared
      emptyDir: {}
