apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-termination
  labels:
    lab: pod-lifecycle
spec:
  terminationGracePeriodSeconds: 20
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - trap 'echo SIGTERM received; sleep 5; echo cleanup complete; exit 0' TERM; while true; do sleep 1; done
