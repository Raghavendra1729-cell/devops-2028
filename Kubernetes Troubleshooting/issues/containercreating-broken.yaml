apiVersion: v1
kind: Pod
metadata:
  name: volume-mount-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, 'sleep 3600']
      volumeMounts:
        - name: config
          mountPath: /config
  volumes:
    - name: config
      configMap:
        name: volume-config
