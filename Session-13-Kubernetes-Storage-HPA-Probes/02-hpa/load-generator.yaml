apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'for i in 1 2 3 4 5 6 7 8; do (while true; do wget -q -O /dev/null http://hpa-demo-service; done) & done; wait'
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
