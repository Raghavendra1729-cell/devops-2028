apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-notes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Raghavendra1729-cell/devops-2028.git
    targetRevision: master
    path: final-devops-project/helm/notes
    helm:
      releaseName: notes
      valueFiles:
        - ../../gitops/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: final-project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
