replicaCount: 1
image:
  repository: devops-notes
  tag: "1.0"
  pullPolicy: IfNotPresent
app:
  greeting: DevOps Notes
  environment: classroom
  version: "1.0"
secret:
  create: false
  name: notes-secret
  token: ""
service:
  port: 5000
ingress:
  enabled: true
  className: nginx
  host: notes.local
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 60
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
