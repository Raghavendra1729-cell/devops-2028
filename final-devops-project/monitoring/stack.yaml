apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\n  evaluation_interval: 5s\nrule_files:\n\
    - /etc/prometheus/alerts.yml\nscrape_configs:\n- job_name: notes\n  static_configs:\n\
    \  - targets:\n    - notes.final-project.svc.cluster.local:5000\n- job_name: prometheus\n\
    \  static_configs:\n  - targets:\n    - localhost:9090\n"
  alerts.yml: "groups:\n- name: application\n  rules:\n  - alert: NotesApplicationDown\n\
    \    expr: up{job=\"notes\"} == 0\n    for: 15s\n    labels:\n      severity:\
    \ warning\n    annotations:\n      summary: Notes application cannot be reached\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: observability
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- name: Prometheus\n  type: prometheus\n\
    \  uid: prometheus\n  access: proxy\n  url: http://prometheus:9090\n  isDefault:\
    \ true\n"
  dashboards.yaml: "apiVersion: 1\nproviders:\n- name: coursework\n  options:\n  \
    \  path: /var/lib/grafana/dashboards\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: observability
data:
  notes.json: '{"title": "DevOps Notes", "uid": "devops-notes", "schemaVersion": 39,
    "version": 1, "refresh": "5s", "time": {"from": "now-15m", "to": "now"}, "panels":
    [{"id": 1, "title": "Application health", "type": "timeseries", "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "up{job=\"notes\"}",
    "refId": "A"}], "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults":
    {"unit": "short"}, "overrides": []}}, {"id": 2, "title": "Requests per second",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"expr": "sum(rate(notes_requests_total[1m]))", "refId": "A"}], "gridPos":
    {"x": 12, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "reqps"},
    "overrides": []}}, {"id": 3, "title": "Application CPU", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr":
    "rate(process_cpu_seconds_total{job=\"notes\"}[1m])", "refId": "A"}], "gridPos":
    {"x": 0, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "percentunit"},
    "overrides": []}}, {"id": 4, "title": "Application memory", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr":
    "process_resident_memory_bytes{job=\"notes\"}", "refId": "A"}], "gridPos": {"x":
    12, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides":
    []}}]}'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observability
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2d
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:12.1.1
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: dashboard
          mountPath: /var/lib/grafana/dashboards
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: config
        configMap:
          name: grafana-config
      - name: dashboard
        configMap:
          name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
